# Keep enough memory for Nubify's Android build without starving the emulator
# and Android Studio on a 16 GB development machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=true

# Reuse unchanged Android/plugin task outputs across debug builds.
# Configuration cache is intentionally not enabled because Flutter's
# DebugMinSdkCheck task is not configuration-cache compatible yet.
org.gradle.caching=true

android.useAndroidX=true

# Flutter AGP 9 compatibility
android.newDsl=false

# Temporary legacy Kotlin mode until Flutter fixes Built-in Kotlin validation
android.builtInKotlin=false
